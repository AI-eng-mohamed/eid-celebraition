<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة العيد الغامرة المستقرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d4af37;
            --bg-gradient: linear-gradient(135deg, #111111, #2c3e50);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: var(--bg-gradient);
            font-family: 'Cairo', sans-serif; color: #fff;
            display: flex; justify-content: center; align-items: center;
            perspective: 1500px; transition: background 0.8s ease;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* الكود يقرأ الصورة المحلية مباشرة الحقيقية مالتنا */
        #haramBg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('kaaba.jpg') no-repeat center center;
            background-size: cover; z-index: 0; opacity: 0;
            transition: opacity 1.2s ease; filter: brightness(0.5);
        }

        .card-container {
            width: 90%; max-width: 420px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; padding: 35px 25px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); z-index: 2;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .card-container.immersed {
            transform: translateZ(-400px) translateY(10px) scale(0.75);
            background: rgba(0, 0, 0, 0.8); border-color: rgba(255, 255, 255, 0.1);
        }

        .icon-box { font-size: 60px; margin-bottom: 5px; animation: float 3s ease-in-out infinite; }
        h1 { font-family: 'Reem Kufi', sans-serif; color: var(--primary-color); font-size: 2.2rem; margin: 10px 0; }
        .message-text { font-size: 1.15rem; line-height: 1.7; margin: 15px 0; }
        .highlight-box { background: rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 12px; font-weight: bold; margin-bottom: 20px; }
        
        .audio-btn {
            background: #ffffff; color: #000; border: none; padding: 12px 25px;
            font-family: 'Cairo', sans-serif; font-size: 1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 10px;
        }

        .controls-wrapper { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .action-btn { background: none; border: none; color: var(--primary-color); font-family: 'Cairo', sans-serif; font-size: 0.95rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: underline; }
        
        #exitBtn {
            display: none; position: absolute; top: 25px; right: 25px;
            background: #ffffff; color: #000; border: none; padding: 10px 22px;
            font-family: 'Cairo', sans-serif; font-weight: bold; border-radius: 30px;
            cursor: pointer; z-index: 10; box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .eidiya-card-details { display: none; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 15px; margin-top: 15px; width: 100%; box-sizing: border-box; }
        .card-number-box { background: rgba(255, 255, 255, 0.15); padding: 8px; border-radius: 6px; font-family: monospace; font-size: 1.2rem; letter-spacing: 2px; margin: 8px 0; color: #00ffcc; }
        .copy-btn { background: var(--primary-color); color: #000; border: none; padding: 6px 15px; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>
    <audio id="eidTakbeer" src="takbeer.mp3" loop style="display:none;"></audio>

    <button id="exitBtn" onclick="stopImmersion()">الرجوع للوضع الطبيعي ↩️</button>

    <div id="haramBg"></div>
    <canvas id="fireworksCanvas"></canvas>

    <div class="card-container" id="card">
        <div class="icon-box" id="mainIcon">🌙</div>
        <h1 id="mainTitle">عيد مبارك</h1>
        <div class="message-text" id="mainMsg">كل عام وأنتم بخير، أعاده الله عليكم باليمن والبركات.</div>
        <div class="highlight-box" id="mainWish">ينعاد عليكم بالصحة والعافية</div>
        
        <button class="audio-btn" id="playBtn" onclick="toggleAudio()">
            <span>ابدأ الاحتفال بالعيد 🎧✨</span>
        </button>

        <div class="controls-wrapper">
            <button class="action-btn" id="immerseToggle" onclick="startImmersion()">
                <span>اضغط 🕋✨</span>
            </button>
            <button class="action-btn" onclick="toggleEidiyaBox()">
                <span>اذا عاجبك
                    <br> تكدر تعايدني اونلاين💸😉</span>
            </button>
        </div>

        <div class="eidiya-card-details" id="eidiyaBox">
            <p style="margin: 0; font-size: 0.85rem; color: #ccc;">يمكنك نسخ رقم الحساب لتحويل العيدية مباشرة:</p>
            <div class="card-number-box" id="cardNumber">9133900168</div>
            <button class="copy-btn" onclick="copyCardNumber()">نسخ رقم الحساب 📋</button>
            <p id="copyStatus" style="margin: 5px 0 0 0; font-size: 0.8rem; color: #00ffcc; display: none;">تم النسخ بنجاح! كثر الله خيرك تسلم 🤍</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userKey = urlParams.get('to');

        const themesData = {
            'father': { title: "عيد مبارك أبو مصطاف", icon: "🕋", msg: "كل عام وأنت السند وتاج الراس يا غالي. ربي يحفظك النا وتظل منور دنيتنا بحكمتك وقوتك.", wish: "بإذن الله السنة الجاية نشوفك على جبل عرفة ونفرح بيك 🕋✨", bg: "linear-gradient(135deg, #2c3e50, #3498db)", color: "#f1c40f" },
            'mother': { title: "عيد مبروك يا ست الحبايب", icon: "🌸", msg: "كل عام وأنتِ أجمل وردة بحديقتنا. ربي يخليج خيمة فوگ راسنا ولا يحرمنا من دعواتج النقيّة.", wish: "يا رب السنة الجاية نطوف سوية بالحرم، وتكون أيامچ كلها خضار وسعادة 🌿🕋", bg: "linear-gradient(135deg, #ff75a0, #fbc2eb)", color: "#ffffff" },
            'brother': { title: "عيد سعيد دكتورنا", icon: "🦷", msg: "كل عام وأنت أحسن طبيب أسنان بالدنيا وأقوى لاعب. ان شاء الله هالسنة تحقق كل طموحاتك الكبيرة.", wish: "يوم اللي نباركلك بفتح العيادة الخاصة مالتك ونفرح بيك! ⚽🏆", bg: "linear-gradient(135deg, #1e3c72, #2a5298)", color: "#00ffff" },
            'sister': { title: "عيدچ مبارك كوكو", icon: "🎀", msg: "كل عام وأنتِ أحلى وألطف أميرة ديزني عدنا. عيدچ كله وناسة وفرحة وحلويات وشغلات مبهجة.", wish: "ان شاء الله تظلين دائماً متميزة ويا ألعابچ Kuromi و Hello Kitty الملونة 🍭✨", bg: "linear-gradient(135deg, #da22ff, #9733ee)", color: "#ffffff" }
        };

        if (userKey && themesData[userKey]) {
            const current = themesData[userKey];
            document.getElementById('mainTitle').innerText = current.title;
            document.getElementById('mainIcon').innerText = current.icon;
            document.getElementById('mainMsg').innerText = current.msg;
            document.getElementById('mainWish').innerText = current.wish;
            document.body.style.background = current.bg;
            document.documentElement.style.setProperty('--primary-color', current.color);
        }

        let isPlaying = false;
        let audioCtx = null;
        const audio = document.getElementById('eidTakbeer');
        const playBtn = document.getElementById('playBtn');

        function toggleAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            if (!isPlaying) {
                isPlaying = true;
                playBtn.innerHTML = "<span>إيقاف الاحتفال 🔇</span>";
                for(let i=0; i<6; i++) fireworks.push(new Firework());
                audio.play().catch(e => console.log("Audio skipped local sandbox block."));
            } else {
                audio.pause();
                playBtn.innerHTML = "<span>ابدأ الاحتفال بالعيد 🎧✨</span>";
                isPlaying = false;
            }
        }

        function startImmersion() {
            document.getElementById('card').classList.add('immersed');
            document.getElementById('haramBg').style.opacity = '1';
            document.getElementById('exitBtn').style.display = 'block';
            document.getElementById('immerseToggle').style.display = 'none';
            if(!isPlaying) { toggleAudio(); }
        }

        function stopImmersion() {
            document.getElementById('card').classList.remove('immersed');
            document.getElementById('haramBg').style.opacity = '0';
            document.getElementById('exitBtn').style.display = 'none';
            document.getElementById('immerseToggle').style.display = 'inline-flex';
        }

        function toggleEidiyaBox() {
            const box = document.getElementById('eidiyaBox');
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        }

        function copyCardNumber() {
            const num = document.getElementById('cardNumber').innerText;
            navigator.clipboard.writeText(num.replace(/\s+/g, '')).then(() => {
                const status = document.getElementById('copyStatus');
                status.style.display = 'block';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            });
        }

        function playExplosionSound() {
            if (!audioCtx || !isPlaying) return;
            try {
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, audioCtx.currentTime);
                const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();
            } catch(e){}
        }

        // --- محرك الألعاب النارية المتكامل ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.radius = Math.random() * 2.5 + 1;
                this.velocity = { x: (Math.random() - 0.5) * 7, y: (Math.random() - 0.5) * 7 };
                this.alpha = 1; this.decay = Math.random() * 0.015 + 0.012;
            }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.restore(); }
            update() { this.velocity.y += 0.04; this.x += this.velocity.x; this.y += this.velocity.y; this.alpha -= this.decay; }
        }

        class Firework {
            constructor() {
                this.x = Math.random() * width; this.y = height;
                this.targetY = Math.random() * (height * 0.5) + 50;
                this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
                this.velocity = Math.random() * 4 + 7; this.particles = []; this.exploded = false;
            }
            update() {
                if (!this.exploded) { this.y -= this.velocity; if (this.y <= this.targetY) { this.exploded = true; this.explode(); } }
                else { for (let i = this.particles.length - 1; i >= 0; i--) { this.particles[i].update(); if (this.particles[i].alpha <= 0) this.particles.splice(i, 1); } }
            }
            explode() { playExplosionSound(); for (let i = 0; i < 60; i++) this.particles.push(new Particle(this.x, this.y, this.color)); }
            draw() { if (!this.exploded) { ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); } else { this.particles.forEach(p => p.draw()); } }
        }

        const fireworks = [];
        function animate() {
            ctx.clearRect(0, 0, width, height);
            if (isPlaying && Math.random() < 0.05 && fireworks.length < 6) { fireworks.push(new Firework()); }
            for (let i = fireworks.length - 1; i >= 0; i--) { fireworks[i].update(); fireworks[i].draw(); if (fireworks[i].exploded && fireworks[i].particles.length === 0) fireworks.splice(i, 1); }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
