<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة العيد الاحترافية التفاعلية بالكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d4af37;
            --bg-gradient: linear-gradient(135deg, #0a0f1d, #070708);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-gradient);
            font-family: 'Cairo', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .gear {
            position: absolute;
            font-size: 140px;
            color: rgba(212, 175, 55, 0.04);
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.1));
            display: none;
            z-index: 0;
        }
        .gear-1 { top: 10%; left: 10%; animation: spin 20s linear infinite; }
        .gear-2 { bottom: 15%; right: 10%; animation: spin-rev 25s linear infinite; }

        .card-container {
            width: 90%;
            max-width: 440px;
            background: rgba(15, 22, 36, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            z-index: 2;
            animation: fadeIn 1s ease-out;
            position: relative;
        }

        .icon-box {
            font-size: 70px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px var(--primary-color));
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-family: 'Reem Kufi', sans-serif;
            color: var(--primary-color);
            font-size: 2.4rem;
            margin: 15px 0 5px 0;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .message-text {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #e2e8f0;
            margin: 20px 0;
        }

        .highlight-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 1.1rem;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .highlight-box::before {
            content: '';
            position: absolute;
            left: 0; top: 10%; height: 80%; width: 4px;
            background: var(--primary-color);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--primary-color);
        }

        .audio-btn {
            background: linear-gradient(135deg, var(--primary-color), #b8860b);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .audio-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.6);
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <audio id="eidTakbeer" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Takbir_Eid.ogg" loop></audio>

    <div class="gear gear-1" id="g1">⚙️</div>
    <div class="gear gear-2" id="g2">⚙️</div>
    <canvas id="fireworksCanvas"></canvas>

    <div class="card-container">
        <div class="icon-box" id="mainIcon">🌙</div>
        <h1 id="mainTitle">عيد مبارك</h1>
        <div class="message-text" id="mainMsg">كل عام وأنتم بخير، أعاده الله عليكم باليمن والبركات والمسرات.</div>
        <div class="highlight-box" id="mainWish">ينعاد عليكم بالصحة والعافية</div>
        
        <button class="audio-btn" id="playBtn" onclick="toggleAudio()">
            <span>ابدأ الاحتفال بالعيد 🎧✨</span>
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userKey = urlParams.get('to');

        const themesData = {
            'father': {
                title: "عيد مبارك أبو مصطاف",
                icon: "🕋",
                msg: "كل عام وأنت السند وتاج الراس يا غالي. ربي يحفظك النا وتظل منور دنيتنا بحكمتك وقوتك.",
                wish: "بإذن الله السنة الجاية نشوفك على جبل عرفة ونفرح بيك 🕋✨",
                bg: "linear-gradient(135deg, #111622, #080b11)",
                color: "#ffca28",
                gears: true
            },
            'mother': {
                title: "عيد مبروك يا ست الحبايب",
                icon: "🌸",
                msg: "كل عام وأنتِ أجمل وردة بحديقتنا. ربي يخليج خيمة فوگ راسنا ولا يحرمنا من دعواتج النقيّة.",
                wish: "يا رب السنة الجاية نطوف سوية بالحرم، وتكون أيامچ كلها خضار وسعادة 🌿🕋",
                bg: "linear-gradient(135deg, #250926, #0d030e)",
                color: "#ff6392",
                gears: false
            },
            'brother': {
                title: "عيد سعيد دكتورنا",
                icon: "🦷",
                msg: "كل عام وأنت أحسن طبيب أسنان بالدنيا وأقوى لاعب. ان شاء الله هالسنة تحقق كل طموحاتك الكبيرة.",
                wish: "يوم اللي نباركلك بفتح العيادة الخاصة مالتك ونفرح بيك! ⚽🏆",
                bg: "linear-gradient(135deg, #061626, #02080f)",
                color: "#00e5ff",
                gears: false
            },
            'sister': {
                title: "عيدچ مبارك كوكو",
                icon: "🎀",
                msg: "كل عام وأنتِ أحلى وألطف أميرة ديزني عدنا. عيدچ كله وناسة وفرحة وحلويات وشغلات مبهجة.",
                wish: "ان شاء الله تظلين دائماً متميزة ويا ألعابچ Kuromi و Hello Kitty الملونة 🍭✨",
                bg: "linear-gradient(135deg, #0f0f10, #050505)",
                color: "#ec407a",
                gears: false
            }
        };

        if (userKey && themesData[userKey]) {
            const current = themesData[userKey];
            document.getElementById('mainTitle').innerText = current.title;
            document.getElementById('mainIcon').innerText = current.icon;
            document.getElementById('mainMsg').innerText = current.msg;
            document.getElementById('mainWish').innerText = current.wish;
            document.body.style.background = current.bg;
            document.documentElement.style.setProperty('--primary-color', current.color);
            
            if (current.gears) {
                document.getElementById('g1').style.display = "block";
                document.getElementById('g2').style.display = "block";
            }
        }

        // إعدادات الصوت والتفاعل
        let isPlaying = false;
        let audioCtx = null;
        const audio = document.getElementById('eidTakbeer');
        const playBtn = document.getElementById('playBtn');

        function toggleAudio() {
            // تهيئة محرك الصوت عند أول ضغطة زبون
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!isPlaying) {
                audio.play().then(() => {
                    playBtn.innerHTML = "<span>إيقاف الاحتفال 🔇</span>";
                    isPlaying = true;
                    // تفعيل إطلاق فوري للألعاب النارية مع تشغيل الصوت
                    for(let i=0; i<4; i++) fireworks.push(new Firework());
                }).catch(e => console.log(e));
            } else {
                audio.pause();
                playBtn.innerHTML = "<span>ابدأ الاحتفال بالعيد 🎧✨</span>";
                isPlaying = false;
            }
        }

        // دالة مخصصة لتوليد صوت انفجار خفيف بالذكاء الصوتي البرمجي وبدون ملفات خارحية
        function playExplosionSound() {
            if (!audioCtx || !isPlaying) return;

            try {
                // تكوين نويز أو ضوضاء بيضاء لمحاكاة الانفجار البصري الفعلي
                const bufferSize = audioCtx.sampleRate * 0.4; // مدة الصوت أقل من نصف ثانية
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // فلتر الصوت لجعله عميقاً وخفيفاً (Lowpass Filter) وليس حاداً ومزعجاً
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, audioCtx.currentTime); // تردد منخفض لصوت دوي خفيف

                // التحكم بمستوى الصوت ليكون خفيفاً جداً بالخلفية
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime); // 0.04 تعني هادئ جداً وتفاعلي
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch(e) { console.log(e); }
        }

        // --- محرك الألعاب النارية البصري المحسن (Canvas) ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.radius = Math.random() * 2.5 + 1;
                this.velocity = { x: (Math.random() - 0.5) * 6, y: (Math.random() - 0.5) * 6 };
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
            }
            update() { this.velocity.y += 0.04; this.x += this.velocity.x; this.y += this.velocity.y; this.alpha -= this.decay; }
        }

        class Firework {
            constructor() {
                this.x = Math.random() * width; this.y = height;
                this.targetY = Math.random() * (height * 0.5) + 50;
                this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
                this.velocity = Math.random() * 4 + 7;
                this.particles = []; this.exploded = false;
            }
            update() {
                if (!this.exploded) {
                    this.y -= this.velocity;
                    if (this.y <= this.targetY) { 
                        this.exploded = true; 
                        this.explode(); 
                    }
                } else {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        this.particles[i].update();
                        if (this.particles[i].alpha <= 0) this.particles.splice(i, 1);
                    }
                }
            }
            explode() { 
                // إطلاق صوت انفجار خفيف بالتزامن مع الانفجار البصري الشاشي
                playExplosionSound();
                for (let i = 0; i < 60; i++) this.particles.push(new Particle(this.x, this.y, this.color)); 
            }
            draw() {
                if (!this.exploded) {
                    ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color; ctx.fill();
                } else { this.particles.forEach(p => p.draw()); }
            }
        }

        const fireworks = [];
        function animate() {
            ctx.fillStyle = 'rgba(10, 15, 29, 0.2)'; ctx.fillRect(0, 0, width, height);
            
            // لا تطلق ألعاب نارية بشكل عشوائي مستمر إلا إذا ضغط المستخدم على الزر وبدأ الاحتفال
            if (isPlaying && Math.random() < 0.04 && fireworks.length < 5) {
                fireworks.push(new Firework());
            }
            
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update(); fireworks[i].draw();
                if (fireworks[i].exploded && fireworks[i].particles.length === 0) fireworks.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
